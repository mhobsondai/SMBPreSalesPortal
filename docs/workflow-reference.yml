# Reference deployment workflow — copy this over the contents of
# .github/workflows/azure-static-web-apps-<name>.yml in the repo.
#
# Replace AZURE_STATIC_WEB_APPS_API_TOKEN_XXXX below with the actual
# hostname-suffixed secret name Azure generated (find it in the file you
# are replacing, or in GitHub → Settings → Secrets → Actions).
#
# WHY THIS SHAPE:
# Oryx (the SWA build container) ships an old glibc. Rollup 4 — which
# Vite 5 uses — needs GLIBC_2.32 for its native binary, so the Oryx build
# fails with ERR_DLOPEN_FAILED. The GitHub Actions runner has a current
# glibc, so we build there and hand the SWA action a finished dist/ with
# skip_app_build. The Python API is left to Oryx, which handles it fine.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_XXXX }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Pre-built output. app_location now points at dist, and
          # output_location must be empty — the SWA action would
          # otherwise look for dist/dist.
          app_location: "frontend/dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          # staticwebapp.config.json lives at the repo root, not inside
          # dist — tell the action where to find it.
          config_file_location: "/"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_XXXX }}
          action: "close"
